name: App Promotion

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'plan-slot or execute-due'
        required: true
        default: 'execute-due'
        type: choice
        options:
          - execute-due
          - plan-slot
      slotIndex:
        description: 'Slot index (1, 2, 3) — only used for plan-slot'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      force:
        description: 'Bypass rotation and past-window gates (testing only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Plan slot
        if: github.event.inputs.action == 'plan-slot'
        run: |
          echo "Planning slot ${{ github.event.inputs.slotIndex }} (force=${{ github.event.inputs.force }})"
          curl -sS -f -X POST "${{ secrets.ROBOSOCIAL_BASE_URL }}/api/app-promotion/plan-slot" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"slotIndex\": ${{ github.event.inputs.slotIndex }}, \"force\": ${{ github.event.inputs.force == 'true' }} }"

      - name: Execute due
        if: github.event.inputs.action == 'execute-due'
        run: |
          echo "Executing due posts"
          curl -sS -f -X POST "${{ secrets.ROBOSOCIAL_BASE_URL }}/api/app-promotion/execute-due" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"